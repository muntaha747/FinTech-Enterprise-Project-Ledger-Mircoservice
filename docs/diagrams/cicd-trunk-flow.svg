<path d="M944,345 L986,345" stroke="#00f5a0" stroke-width="3"/><path d="M980,339 L988,345 L980,351" fill="none" stroke="#00f5a0" stroke-width="3"/>
<g filter="url(#glow)"><rect x="990" y="300" width="190" height="90" rx="16" fill="#11172e" stroke="#ff4d4d" stroke-width="2.5"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></rect></g>
<text x="1085" y="338" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff4d4d">Prod · MANUAL</text>

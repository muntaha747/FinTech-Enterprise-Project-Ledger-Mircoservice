<g filter="url(#glow)"><rect x="816" y="112" width="110" height="82" rx="14" fill="#11172e" stroke="#2dd4bf" stroke-width="2.5"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></rect></g>

<text x="1133" y="187" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">step 9</text>
<path d="M30,153 L1140,153" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
<circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M30,153 L1140,153"/></circle>
<path d="M1133,194 C1133,250 125,250 125,300" fill="none" stroke="#f7b733" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/></path>
<text x="600" y="262" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#f7b733">CI job success → triggers CD pipeline (repo_dispatch / workflow_run)</text>

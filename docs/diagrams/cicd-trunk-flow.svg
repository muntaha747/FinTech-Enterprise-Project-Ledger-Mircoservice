<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" role="img"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient><linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="600" rx="22" fill="url(#bg)"/><text x="600.0" y="50" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#ttl)" text-anchor="middle">Ledger Microservice · CI/CD Trunk-Based Flow</text><text x="600.0" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Feature branch runs CI below · merged to MAIN (trunk, top) · CD promotes one artifact through dev → qa → stage → prod</text><rect x="14" y="98" width="1172" height="170" rx="18" fill="#ff2d95" fill-opacity="0.12" stroke="#ff2d95" stroke-width="2"/><text x="30" y="124" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff2d95" text-anchor="start">MAIN · TRUNK  (CI on merge + CD to qa / stage / prod)</text><rect x="14" y="318" width="1172" height="170" rx="18" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-width="2"/><text x="30" y="344" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#00e5ff" text-anchor="start">FEATURE BRANCH  (CI on every push · CD to dev)</text><rect x="20" y="130" width="196" height="120" rx="16" fill="#0b1224" stroke="#39ff14" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="20" y="130" width="196" height="36" rx="14" fill="#39ff14"/><text x="118.0" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Merge to main</text><text x="32" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Dev + QA sign-off done</text><text x="32" y="209" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Trunk gets the commit</text><line x1="219" y1="190" x2="258" y2="190" stroke="#39ff14" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="258,190 244,182 244,198" fill="#39ff14"/><rect x="261" y="130" width="196" height="120" rx="16" fill="#0b1224" stroke="#ffe600" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="261" y="130" width="196" height="36" rx="14" fill="#ffe600"/><text x="359.0" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">CI Steps 1–7</text><text x="273" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Build, test, JaCoCo</text><text x="273" y="209" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Trivy, Sonar, gate, ECR</text><text x="273" y="230" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">New artifact on main</text><line x1="460" y1="190" x2="499" y2="190" stroke="#ffe600" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="499,190 485,182 485,198" fill="#ffe600"/><rect x="502" y="130" width="196" height="120" rx="16" fill="#0b1224" stroke="#ff9f1c" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="502" y="130" width="196" height="36" rx="14" fill="#ff9f1c"/><text x="600.0" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD → QA</text><text x="514" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Auto sync</text><text x="514" y="209" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Regression testing</text><line x1="701" y1="190" x2="740" y2="190" stroke="#ff9f1c" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="740,190 726,182 726,198" fill="#ff9f1c"/><rect x="743" y="130" width="196" height="120" rx="16" fill="#0b1224" stroke="#b388ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="743" y="130" width="196" height="36" rx="14" fill="#b388ff"/><text x="841.0" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD → Stage</text><text x="755" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Auto sync</text><text x="755" y="209" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Performance + load test</text><line x1="942" y1="190" x2="981" y2="190" stroke="#b388ff" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="981,190 967,182 967,198" fill="#b388ff"/><rect x="984" y="130" width="196" height="120" rx="16" fill="#0b1224" stroke="#ff1744" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="984" y="130" width="196" height="36" rx="14" fill="#ff1744"/><text x="1082.0" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">PROD (manual)</text><text x="996" y="188" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Argo CD waits for</text><text x="996" y="209" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">human approval click</text><rect x="20" y="350" width="196" height="120" rx="16" fill="#0b1224" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="20" y="350" width="196" height="36" rx="14" fill="#00e5ff"/><text x="118.0" y="374" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Developer push</text><text x="32" y="408" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">git push feature/*</text><text x="32" y="429" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Short-lived branch</text><line x1="219" y1="410" x2="258" y2="410" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="258,410 244,402 244,418" fill="#00e5ff"/><rect x="261" y="350" width="196" height="120" rx="16" fill="#0b1224" stroke="#ffe600" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="261" y="350" width="196" height="36" rx="14" fill="#ffe600"/><text x="359.0" y="374" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">CI Steps 1–7</text><text x="273" y="408" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Maven build + tests</text><text x="273" y="429" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">JaCoCo · Trivy · Sonar</text><text x="273" y="450" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Quality gate · ECR scan</text><line x1="460" y1="410" x2="499" y2="410" stroke="#ffe600" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="499,410 485,402 485,418" fill="#ffe600"/><rect x="502" y="350" width="196" height="120" rx="16" fill="#0b1224" stroke="#ff9f1c" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="502" y="350" width="196" height="36" rx="14" fill="#ff9f1c"/><text x="600.0" y="374" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD → DEV</text><text x="514" y="408" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Auto sync</text><text x="514" y="429" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Smoke check</text><line x1="701" y1="410" x2="740" y2="410" stroke="#ff9f1c" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="740,410 726,402 726,418" fill="#ff9f1c"/><rect x="743" y="350" width="196" height="120" rx="16" fill="#0b1224" stroke="#ff2d95" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="743" y="350" width="196" height="36" rx="14" fill="#ff2d95"/><text x="841.0" y="374" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">QA functional</text><text x="755" y="408" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">QA runs functional</text><text x="755" y="429" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">tests on dev</text><line x1="942" y1="410" x2="981" y2="410" stroke="#ff2d95" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="981,410 967,402 967,418" fill="#ff2d95"/><rect x="984" y="350" width="196" height="120" rx="16" fill="#0b1224" stroke="#39ff14" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="984" y="350" width="196" height="36" rx="14" fill="#39ff14"/><text x="1082.0" y="374" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">QA passed ✔</text><text x="996" y="408" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Merge request</text><text x="996" y="429" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">→ main (trunk)</text><path d="M1082.0,350 L1082.0,300 L118.0,300 L118.0,250" fill="none" stroke="#39ff14" stroke-width="4" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.4s" repeatCount="indefinite"/></path><text x="600.0" y="292" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#39ff14" text-anchor="middle">merge after QA passes  ▲  promote the same artifact to main</text><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M20,190 L1160,190"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M20,410 L1160,410"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M1082.0,350 L1082.0,300 L118.0,300 L118.0,250"/></circle><text x="30" y="520" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Build once: one JAR and one image (rel&lt;run_number&gt;) per commit, promoted unchanged through every environment.</text><text x="30" y="546" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fde68a" text-anchor="start">Production never deploys automatically: Argo CD auto-sync is OFF for prod; a human approves the sync.</text><text x="30" y="572" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#a5f3fc" text-anchor="start">Hybrid runners: GitHub-hosted for standard build steps · self-hosted where private network access is needed.</text></svg>
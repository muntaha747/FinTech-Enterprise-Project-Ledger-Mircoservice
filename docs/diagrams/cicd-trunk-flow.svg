<text x="605" y="338" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#2dd4bf">ArgoCD QA</text>
<text x="605" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2e8f0">Regression tests</text>
<text x="605" y="380" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">Argo CD · auto sync</text>

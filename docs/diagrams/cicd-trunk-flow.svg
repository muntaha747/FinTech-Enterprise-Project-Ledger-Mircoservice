<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-label="CI/CD trunk-based flow">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1442"/></linearGradient>
<linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ff6ec7"/><stop offset="0.5" stop-color="#f7b733"/><stop offset="1" stop-color="#00d2ff"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="520" rx="18" fill="url(#bg)"/>
<text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#title)">Ledger Microservice · CI/CD Trunk-Based Flow</text>
<text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#c7d2fe">GitHub Actions (hybrid: hosted + self-hosted runners) → CI builds once · Argo CD deploys per environment</text>

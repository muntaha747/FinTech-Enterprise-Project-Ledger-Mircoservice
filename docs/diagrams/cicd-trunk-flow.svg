<g filter="url(#glow)"><rect x="750" y="300" width="190" height="90" rx="16" fill="#11172e" stroke="#fb923c" stroke-width="2.5"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></rect></g>

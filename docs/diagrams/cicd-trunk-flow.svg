<text x="1085" y="380" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">Argo CD · manual sync</text>
<path d="M30,345 L1170,345" stroke="#334155" stroke-width="2" stroke-dasharray="4 8" opacity="0"/>
<circle r="7" fill="#86efac" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M30,345 L1170,345"/></circle>
<text x="600" y="430" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e2e8f0">QA functional ✔ → merge · Regression (QA) ✔ → Performance/load (Stage) ✔ → Prod sync needs human approval</text>
<text x="600" y="470" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">Artifact built once per commit → same image promoted through dev → qa → stage → prod</text>

<text x="216" y="169" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e2e8f0">mvn clean package</text>
<text x="216" y="187" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">step 2</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient><linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="560" rx="22" fill="url(#bg)"/><text x="600.0" y="50" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#ttl)" text-anchor="middle">STEP 1 · Build &amp; Unit Test (Maven)</text><text x="600.0" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">mvn clean → compile → test → package · Java 17 · Spring Boot 3.1.2</text><rect x="20.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="20.0" y="125" width="196" height="36" rx="14" fill="#00e5ff"/><text x="118.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Source Code</text><text x="32.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">src/main/java/...</text><text x="32.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">src/test/java/...</text><text x="32.0" y="225" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">pom.xml (Java 17)</text><line x1="220.0" y1="205" x2="337.3333333333333" y2="205" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="337.3333333333333,205 323.3333333333333,197 323.3333333333333,213" fill="#00e5ff"/><rect x="341.3333333333333" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#ff9f1c" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="341.3333333333333" y="125" width="196" height="36" rx="14" fill="#ff9f1c"/><text x="439.3333333333333" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">mvn clean</text><text x="353.3333333333333" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Deletes old target/</text><text x="353.3333333333333" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Fresh build every run</text><line x1="541.3333333333333" y1="205" x2="658.6666666666666" y2="205" stroke="#ff9f1c" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="658.6666666666666,205 644.6666666666666,197 644.6666666666666,213" fill="#ff9f1c"/><rect x="662.6666666666666" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#ffe600" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="662.6666666666666" y="125" width="196" height="36" rx="14" fill="#ffe600"/><text x="760.6666666666666" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">compile + test</text><text x="674.6666666666666" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">JUnit 5 unit tests</text><text x="674.6666666666666" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Testcontainers (MySQL)</text><text x="674.6666666666666" y="225" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Test failure = stop</text><line x1="862.6666666666666" y1="205" x2="980.0" y2="205" stroke="#ffe600" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="980.0,205 966.0,197 966.0,213" fill="#ffe600"/><rect x="984.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#39ff14" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="984.0" y="125" width="196" height="36" rx="14" fill="#39ff14"/><text x="1082.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">mvn package</text><text x="996.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Spring Boot fat JAR</text><text x="996.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">target/*.jar</text><text x="996.0" y="225" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Renamed backend_rel&lt;N&gt;</text><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M20,205 L1160,205"/></circle><rect x="20" y="312" width="1160" height="230" rx="18" fill="#050b1a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/><text x="40.0" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#00e5ff" text-anchor="start">WHAT IT DOES</text><text x="40.0" y="368" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Maven runs the lifecycle clean → compile → test → package in</text><text x="54.0" y="387" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">  order.</text><text x="40.0" y="411" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Unit tests run in the test phase, before the JAR is packaged.</text><text x="40.0" y="435" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Each run makes one JAR, traceable by its GitHub run number.</text><text x="610.0" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#39ff14" text-anchor="start">WHY WE USE IT</text><text x="610.0" y="368" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ A failing test stops the pipeline, so a broken JAR is never built.</text><text x="610.0" y="392" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Clean builds avoid stale classes left over from earlier runs.</text><text x="610.0" y="416" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Main rebuilds this JAR after a merge; that JAR goes to qa, stage</text><text x="624.0" y="435" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">  and prod.</text><text x="600" y="548" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Gate: a failed check stops the pipeline here, so the next step never runs.</text></svg>
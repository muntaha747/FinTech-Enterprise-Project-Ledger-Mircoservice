<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient><linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="640" rx="22" fill="url(#bg)"/><text x="600.0" y="50" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#ttl)" text-anchor="middle">GitOps with Argo CD · Git is the source of truth</text><text x="600.0" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Argo CD compares the Git manifests with each cluster and syncs the difference. Prod waits for a human.</text><rect x="20" y="200" width="260" height="170" rx="16" fill="#0b1224" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="20" y="200" width="260" height="36" rx="14" fill="#00e5ff"/><text x="150.0" y="224" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Git · GitOps repo</text><text x="32" y="258" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">ledger-deployment repo</text><text x="32" y="279" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Manifests + image tag</text><text x="32" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Changed by CI on success</text><rect x="410" y="190" width="330" height="190" rx="16" fill="#0b1224" stroke="#b388ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="410" y="190" width="330" height="36" rx="14" fill="#b388ff"/><text x="575.0" y="214" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD controller</text><text x="422" y="248" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Watches Git every few min</text><text x="422" y="269" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Detects drift (diff)</text><text x="422" y="290" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Syncs the cluster to Git</text><rect x="900" y="110" width="270" height="90" rx="16" fill="#0b1224" stroke="#39ff14" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="900" y="110" width="270" height="36" rx="14" fill="#39ff14"/><text x="1035.0" y="134" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Cluster · DEV</text><text x="912" y="168" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Auto sync · smoke check</text><rect x="900" y="230" width="270" height="90" rx="16" fill="#0b1224" stroke="#ffe600" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="900" y="230" width="270" height="36" rx="14" fill="#ffe600"/><text x="1035.0" y="254" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Cluster · QA</text><text x="912" y="288" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Auto sync · regression</text><rect x="900" y="350" width="270" height="90" rx="16" fill="#0b1224" stroke="#ff9f1c" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="900" y="350" width="270" height="36" rx="14" fill="#ff9f1c"/><text x="1035.0" y="374" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Cluster · STAGE</text><text x="912" y="408" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Auto sync · perf + load</text><rect x="900" y="470" width="270" height="90" rx="16" fill="#0b1224" stroke="#ff1744" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="900" y="470" width="270" height="36" rx="14" fill="#ff1744"/><text x="1035.0" y="494" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Cluster · PROD</text><text x="912" y="528" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">MANUAL sync · approval</text><line x1="280" y1="285" x2="396.0" y2="285.0" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="410,285 396.0,293.0 396.0,277.0" fill="#00e5ff"/><text x="300" y="270" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#a5f3fc" text-anchor="start">reads desired</text><path d="M740,285 H820 V155 H900" fill="none" stroke="#39ff14" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></path><path d="M740,285 H820 V275 H900" fill="none" stroke="#ffe600" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></path><path d="M740,285 H820 V395 H900" fill="none" stroke="#ff9f1c" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></path><path d="M740,285 H820 V515 H900" fill="none" stroke="#ff1744" stroke-width="4" stroke-dasharray="4 8"/><rect x="700" y="532" width="180" height="32" rx="10" fill="#ff1744"/><text x="790" y="554" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">approval gate</text><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M280,285 H410"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M740,285 H820 V155 H900"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M740,285 H820 V525 H900"/></circle><text x="30" y="420" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffe600" text-anchor="start">How it works</text><text x="30" y="452" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#f1f5f9" text-anchor="start">1. CI finishes and writes the new image tag into the GitOps repo (Git is the only source of truth).</text><text x="30" y="478" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#f1f5f9" text-anchor="start">2. Argo CD notices the difference between Git and the running cluster (drift).</text><text x="30" y="504" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#f1f5f9" text-anchor="start">3. dev, qa and stage sync automatically. A bad change is rolled back by reverting a commit in Git.</text><text x="30" y="530" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#f1f5f9" text-anchor="start">4. prod never auto-syncs: an engineer reviews the diff in Argo CD and clicks Sync to approve.</text><text x="30" y="556" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#f1f5f9" text-anchor="start">5. Argo CD shows health (Healthy / Degraded) and sync state for every environment.</text><text x="30" y="620" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fde68a" text-anchor="start">CI builds the artifact · CD only moves the tag between environments. Two pipelines, one source of truth.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient><linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="640" rx="22" fill="url(#bg)"/><text x="600.0" y="50" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#ttl)" text-anchor="middle">Application Architecture · Ledger Service</text><text x="600.0" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">How one REST request travels through Spring Boot layers into MySQL, and how Kubernetes checks the app is alive</text><rect x="290" y="112" width="560" height="380" rx="20" fill="#ff2d95" fill-opacity="0.10" stroke="#ff2d95" stroke-width="3" stroke-dasharray="8 6"/><text x="310" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff2d95" text-anchor="start">Spring Boot 3.1.2 · Java 17 · port 8080</text><rect x="20" y="170" width="200" height="130" rx="16" fill="#0b1224" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="20" y="170" width="200" height="36" rx="14" fill="#00e5ff"/><text x="120.0" y="194" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Client</text><text x="32" y="228" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">curl / browser / app</text><text x="32" y="249" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">REST + JSON requests</text><rect x="330" y="165" width="470" height="88" rx="16" fill="#0b1224" stroke="#ffe600" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="330" y="165" width="470" height="36" rx="14" fill="#ffe600"/><text x="565.0" y="189" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">BookController  (REST)</text><text x="342" y="223" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">GET /books · POST /books</text><text x="342" y="244" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Maps HTTP to Java objects</text><rect x="330" y="275" width="470" height="88" rx="16" fill="#0b1224" stroke="#39ff14" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="330" y="275" width="470" height="36" rx="14" fill="#39ff14"/><text x="565.0" y="299" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">BookService  (business logic)</text><text x="342" y="333" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Validates book input</text><text x="342" y="354" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Calls the repository</text><rect x="330" y="385" width="470" height="88" rx="16" fill="#0b1224" stroke="#ff9f1c" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="330" y="385" width="470" height="36" rx="14" fill="#ff9f1c"/><text x="565.0" y="409" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">BookRepository  (Spring Data JPA)</text><text x="342" y="443" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Writes SQL for you</text><text x="342" y="464" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">No hand-written queries</text><rect x="920" y="280" width="260" height="150" rx="16" fill="#0b1224" stroke="#2979ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="920" y="280" width="260" height="36" rx="14" fill="#2979ff"/><text x="1050.0" y="304" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">MySQL 8</text><text x="932" y="338" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">books table</text><text x="932" y="359" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">ledger database</text><text x="932" y="380" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Schema via JPA</text><line x1="220" y1="235" x2="316.0" y2="235.0" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="330,235 316.0,243.0 316.0,227.0" fill="#00e5ff"/><line x1="565" y1="253" x2="565.0" y2="261.0" stroke="#ffe600" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="565,275 557.0,261.0 573.0,261.0" fill="#ffe600"/><line x1="565" y1="363" x2="565.0" y2="371.0" stroke="#39ff14" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="565,385 557.0,371.0 573.0,371.0" fill="#39ff14"/><line x1="800" y1="429" x2="906.0" y2="429.0" stroke="#ff9f1c" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="920,429 906.0,437.0 906.0,421.0" fill="#ff9f1c"/><rect x="330" y="520" width="470" height="62" rx="16" fill="#0b1224" stroke="#ff1744" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="330" y="520" width="470" height="36" rx="14" fill="#ff1744"/><text x="565.0" y="544" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Actuator probes (health checks)</text><text x="342" y="578" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">/actuator/health/liveness · /readiness</text><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M220,235 H330"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M565,253 V275"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M565,363 V385"/></circle><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M800,429 H920"/></circle><path d="M800,551 H900 V355 H920" fill="none" stroke="#ff1744" stroke-width="2.5" stroke-dasharray="4 6"/><text x="900" y="520" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fca5a5" text-anchor="start">probes check the DB</text><text x="30" y="612" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="start">Every request goes controller → service → repository → database. Liveness says the app is running; readiness says it can take traffic.</text></svg>
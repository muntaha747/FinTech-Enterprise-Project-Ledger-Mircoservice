<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="06 · Steps 5–6: Trivy SCA Scan and Quality Gate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#fdf4ff"/></linearGradient>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .h { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .t { font: 400 12.5px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .num { font: 700 13px 'Segoe UI', Arial, sans-serif; }
      .lbl { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .note { font: 600 13px 'Segoe UI', Arial, sans-serif; }
      .foot { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow { fill: none; stroke-width: 2.5; stroke-dasharray: 7 6; animation: flow 1s linear infinite; }
      .box { stroke: #ffffff; stroke-width: 2; animation: breathe 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -26; } }
      @keyframes breathe { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .arrow, .box { animation: none; } }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1100" height="600" fill="url(#bg)"/>
  <text x="550.0" y="38" text-anchor="middle" class="title">06 · Steps 5–6: Trivy SCA Scan and Quality Gate</text>
  <text x="550.0" y="62" text-anchor="middle" class="sub">Software Composition Analysis checks third-party libraries for known CVEs</text>
  <g filter="url(#shadow)"><rect class="box" x="40" y="220" width="220" height="140" rx="14" fill="#475569" style="animation-delay:0.25s"/></g>
<text x="54" y="246" class="h">pom.xml + source</text>
<text x="54" y="268" class="t">the project files</text>
<text x="54" y="286" class="t">dependency list</text>
<text x="54" y="304" class="t">target/ skipped</text>
<g filter="url(#shadow)"><rect class="box" x="290" y="220" width="220" height="140" rx="14" fill="#ea580c" style="animation-delay:0.50s"/></g>
<text x="304" y="246" class="h">5 · Trivy fs scan</text>
<text x="304" y="268" class="t">aquasec/trivy:0.50.0</text>
<text x="304" y="286" class="t">fs . --skip-dirs target</text>
<text x="304" y="304" class="t">docker run on runner</text>
<circle cx="492" cy="238" r="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="492" y="243" text-anchor="middle" class="num" fill="#ea580c">5</text>
<g filter="url(#shadow)"><rect class="box" x="540" y="220" width="220" height="140" rx="14" fill="#f59e0b" style="animation-delay:0.75s"/></g>
<text x="554" y="246" class="h">trivy-fs.json</text>
<text x="554" y="268" class="t">CVE id, package</text>
<text x="554" y="286" class="t">severity, fixed version</text>
<text x="554" y="304" class="t">saved in reports/</text>
<g filter="url(#shadow)"><rect class="box" x="790" y="220" width="220" height="140" rx="14" fill="#8b5cf6" style="animation-delay:1.00s"/></g>
<text x="804" y="246" class="h">Convert to SARIF</text>
<text x="804" y="268" class="t">trivy convert sarif</text>
<text x="804" y="286" class="t">reports/trivy-fs.sarif</text>
<text x="804" y="304" class="t">for SonarCloud</text>
<g filter="url(#shadow)"><rect class="box" x="290" y="410" width="220" height="130" rx="14" fill="#65a30d" style="animation-delay:1.25s"/></g>
<text x="304" y="436" class="h">Trivy DB cache</text>
<text x="304" y="458" class="t">$HOME/.cache/trivy</text>
<text x="304" y="476" class="t">keeps the vulnerability DB</text>
<text x="304" y="494" class="t">faster repeat scans</text>
<g filter="url(#shadow)"><rect class="box" x="540" y="410" width="220" height="130" rx="14" fill="#e11d48" style="animation-delay:0.00s"/></g>
<text x="554" y="436" class="h">6 · Quality gate</text>
<text x="554" y="458" class="t">fail on fixable CRITICAL</text>
<text x="554" y="476" class="t">current status: report only</text>
<text x="554" y="494" class="t">continue-on-error</text>
<circle cx="742" cy="428" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
<text x="742" y="433" text-anchor="middle" class="num" fill="#e11d48">6</text>
<g filter="url(#shadow)"><rect class="box" x="790" y="410" width="220" height="130" rx="14" fill="#ec4899" style="animation-delay:0.25s"/></g>
<text x="804" y="436" class="h">To SonarCloud</text>
<text x="804" y="458" class="t">step 7 imports SARIF</text>
<text x="804" y="476" class="t">shows CVEs on dashboard</text>
<circle cx="992" cy="428" r="14" fill="#ffffff" stroke="#ec4899" stroke-width="2"/>
<text x="992" y="433" text-anchor="middle" class="num" fill="#ec4899">7</text>
<path id="p0" class="arrow" d="M260.0,290.0 L290.0,290.0" stroke="#334155" marker-end="url(#head)"/>
<path id="p1" class="arrow" d="M510.0,290.0 L540.0,290.0" stroke="#334155" marker-end="url(#head)"/>
<path id="p2" class="arrow" d="M760.0,290.0 L790.0,290.0" stroke="#334155" marker-end="url(#head)"/>
<path id="p3" class="arrow" d="M400.0,410.0 L400.0,360.0" stroke="#65a30d" marker-end="url(#head)"/>
<text x="400.0" y="377.0" text-anchor="middle" class="lbl">uses cache</text>
<path id="p4" class="arrow" d="M650.0,360.0 L650.0,410.0" stroke="#e11d48" marker-end="url(#head)"/>
<path id="p5" class="arrow" d="M900.0,360.0 L900.0,410.0" stroke="#ec4899" marker-end="url(#head)"/>
<text x="900.0" y="377.0" text-anchor="middle" class="lbl">SARIF</text>
  <text x="550.0" y="556" text-anchor="middle" class="foot">Trivy reads pom.xml dependencies, skips target/, and saves JSON and SARIF reports.</text><text x="550.0" y="576" text-anchor="middle" class="foot">The SCA step is report only today. Gate step 6 applies to the image scan, and is non-blocking for now.</text><text x="550.0" y="596" text-anchor="middle" class="foot">The SARIF file is imported into SonarCloud in step 7.</text>
  <circle r="5.5" fill="#334155" stroke="#ffffff" stroke-width="1.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.0s"><mpath href="#p0"/></animateMotion></circle>
<circle r="5.5" fill="#334155" stroke="#ffffff" stroke-width="1.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.5s"><mpath href="#p1"/></animateMotion></circle>
<circle r="5.5" fill="#334155" stroke="#ffffff" stroke-width="1.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.0s"><mpath href="#p2"/></animateMotion></circle>
<circle r="5.5" fill="#65a30d" stroke="#ffffff" stroke-width="1.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.5s"><mpath href="#p3"/></animateMotion></circle>
<circle r="5.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.0s"><mpath href="#p4"/></animateMotion></circle>
<circle r="5.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.0s"><mpath href="#p5"/></animateMotion></circle>
</svg>

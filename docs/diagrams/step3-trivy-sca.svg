<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient><linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="560" rx="22" fill="url(#bg)"/><text x="600.0" y="50" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#ttl)" text-anchor="middle">STEP 3 · Software Composition Analysis (Trivy)</text><text x="600.0" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">SCA · finds known CVEs in third-party libraries</text><rect x="20.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="20.0" y="125" width="196" height="36" rx="14" fill="#00e5ff"/><text x="118.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">pom.xml</text><text x="32.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Declared dependencies</text><text x="32.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Spring, Jackson, MySQL</text><line x1="220.0" y1="205" x2="257.0" y2="205" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="257.0,205 243.0,197 243.0,213" fill="#00e5ff"/><rect x="261.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#39ff14" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="261.0" y="125" width="196" height="36" rx="14" fill="#39ff14"/><text x="359.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Trivy fs scan</text><text x="273.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Scans filesystem + deps</text><text x="273.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Read-only scan</text><line x1="461.0" y1="205" x2="498.0" y2="205" stroke="#39ff14" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="498.0,205 484.0,197 484.0,213" fill="#39ff14"/><rect x="502.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#ff9f1c" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="502.0" y="125" width="196" height="36" rx="14" fill="#ff9f1c"/><text x="600.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Vuln Database</text><text x="514.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Known CVEs</text><text x="514.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">LOW → CRITICAL</text><line x1="702.0" y1="205" x2="739.0" y2="205" stroke="#ff9f1c" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="739.0,205 725.0,197 725.0,213" fill="#ff9f1c"/><rect x="743.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#ffe600" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="743.0" y="125" width="196" height="36" rx="14" fill="#ffe600"/><text x="841.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">JSON Report</text><text x="755.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">trivy-report.json</text><text x="755.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Uploaded as artifact</text><line x1="943.0" y1="205" x2="980.0" y2="205" stroke="#ffe600" stroke-width="4" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></line><polygon points="980.0,205 966.0,197 966.0,213" fill="#ffe600"/><rect x="984.0" y="125" width="196" height="160" rx="16" fill="#0b1224" stroke="#ff2d95" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></rect><rect x="984.0" y="125" width="196" height="36" rx="14" fill="#ff2d95"/><text x="1082.0" y="149" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b1224" text-anchor="middle">Triage</text><text x="996.0" y="183" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">CRITICAL / HIGH found?</text><text x="996.0" y="204" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Upgrade to fixed version</text><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M20,205 L1160,205"/></circle><rect x="20" y="312" width="1160" height="230" rx="18" fill="#050b1a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/><text x="40.0" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#00e5ff" text-anchor="start">WHAT IT DOES</text><text x="40.0" y="368" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ SCA (Software Composition Analysis) finds known CVEs in open-</text><text x="54.0" y="387" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">  source libraries.</text><text x="40.0" y="411" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Trivy scans the project files and dependency manifests in one</text><text x="54.0" y="430" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">  command.</text><text x="40.0" y="454" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ The JSON report is stored as a build artifact for audit trails.</text><text x="610.0" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#39ff14" text-anchor="start">WHY WE USE IT</text><text x="610.0" y="368" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Most of a Java app's risk comes from libraries, not from your own</text><text x="624.0" y="387" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">  code.</text><text x="610.0" y="411" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ A vulnerable library is caught before it is packaged into an</text><text x="624.0" y="430" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">  image.</text><text x="610.0" y="454" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#f1f5f9" text-anchor="start">▸ Runs on every commit, so newly published CVEs are found quickly.</text><text x="600" y="548" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Gate: a failed check stops the pipeline here, so the next step never runs.</text></svg>
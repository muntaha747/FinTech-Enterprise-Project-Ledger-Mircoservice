<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" role="img"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient><linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect width="1200" height="700" rx="22" fill="url(#bg)"/><text x="600.0" y="50" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#ttl)" text-anchor="middle">Quality-Gate Funnel · Every check a build must pass</text><text x="600.0" y="80" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Checks run top to bottom. A failure at any level stops the pipeline, so bad code never reaches an environment.</text><rect x="60" y="120" width="1080" height="58" rx="16" fill="#ffe600" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.0s" repeatCount="indefinite"/></rect><text x="600.0" y="146" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">1 · Build + unit tests</text><text x="600.0" y="166" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">mvn package · JUnit 5 · Testcontainers</text><path d="M600,178 V192" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/><rect x="102" y="192" width="996" height="58" rx="16" fill="#ff9f1c" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/></rect><text x="600.0" y="218" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">2 · Code coverage</text><text x="600.0" y="238" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">JaCoCo · target 80% on new code</text><path d="M600,250 V264" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/><rect x="144" y="264" width="912" height="58" rx="16" fill="#39ff14" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/></rect><text x="600.0" y="290" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">3 · Dependency CVEs (SCA)</text><text x="600.0" y="310" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">Trivy · CRITICAL/HIGH in pom.xml</text><path d="M600,322 V336" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/><rect x="186" y="336" width="828" height="58" rx="16" fill="#b388ff" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/></rect><text x="600.0" y="362" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">4 · Code security + quality (SAST)</text><text x="600.0" y="382" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">SonarQube · bugs, vulns, hotspots</text><path d="M600,394 V408" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/><rect x="228" y="408" width="744" height="58" rx="16" fill="#ff2d95" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/></rect><text x="600.0" y="434" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">5 · Quality Gate verdict</text><text x="600.0" y="454" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">PASS/FAIL rules · waits for result</text><path d="M600,466 V480" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/><rect x="270" y="480" width="660" height="58" rx="16" fill="#2979ff" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="3.0s" repeatCount="indefinite"/></rect><text x="600.0" y="506" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">6 · Image scan (ECR / Clair)</text><text x="600.0" y="526" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">CVEs in OS + app packages of the image</text><path d="M600,538 V552" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4"/><rect x="312" y="552" width="576" height="58" rx="16" fill="#00e5ff" fill-opacity="0.92"><animate attributeName="fill-opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/></rect><text x="600.0" y="578" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="middle">7 · Deploy to dev (Argo CD)</text><text x="600.0" y="598" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0b1224" text-anchor="middle">Only artifacts that passed 1–6 get here</text><path d="M1150,150 V560" stroke="#ff1744" stroke-width="3" stroke-dasharray="8 6"/><text x="1150" y="640" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff8a80" text-anchor="end">FAIL ✖ stops here</text><circle r="7" fill="#ffffff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M600,140 V580"/></circle><text x="600" y="660" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fde68a" text-anchor="middle">Gates 1–5 run in CI on every branch. Gates 6–7 finish the job: scanned image + verified code → dev.</text><text x="600" y="684" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#a5f3fc" text-anchor="middle">Prod is protected separately by a manual approval in Argo CD (see GitOps diagram).</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="FinTech Ledger CI/CD flow: 20 steps, 19 tools">
  <defs>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub   { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .h     { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .t     { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .chip  { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .lane  { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .box   { stroke: #ffffff; stroke-width: 2; animation: breathe 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes breathe { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .arrow, .box { animation: none; } }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="36" text-anchor="middle" class="title">FinTech Ledger · CI/CD Flow</text>
  <text x="600" y="60" text-anchor="middle" class="sub">20 steps (19 build + 1 deploy) · 19 tools · Java 17 Spring Boot microservice</text>

  <!-- ROW 1: CI, five phases (left to right) -->
  <text x="20" y="90" class="lane">CI · BUILD, TEST, SECURE, PUSH</text>
  <g filter="url(#shadow)">
    <rect class="box" x="20"  y="100" width="200" height="120" rx="16" fill="#6366f1"/>
    <rect class="box" x="260" y="100" width="200" height="120" rx="16" fill="#0ea5e9" style="animation-delay:.3s"/>
    <rect class="box" x="500" y="100" width="200" height="120" rx="16" fill="#f59e0b" style="animation-delay:.6s"/>
    <rect class="box" x="740" y="100" width="200" height="120" rx="16" fill="#10b981" style="animation-delay:.9s"/>
    <rect class="box" x="980" y="100" width="200" height="120" rx="16" fill="#8b5cf6" style="animation-delay:1.2s"/>
  </g>
  <text x="120" y="130" text-anchor="middle" class="h">Phase 1 · Checkout</text>
  <text x="120" y="152" text-anchor="middle" class="t">steps 1–2</text>
  <text x="120" y="172" text-anchor="middle" class="t">Gitleaks secret scan</text>
  <text x="120" y="190" text-anchor="middle" class="t">full Git history</text>

  <text x="360" y="130" text-anchor="middle" class="h">Phase 2 · Build</text>
  <text x="360" y="152" text-anchor="middle" class="t">steps 3–6</text>
  <text x="360" y="172" text-anchor="middle" class="t">Maven · JUnit · JaCoCo</text>
  <text x="360" y="190" text-anchor="middle" class="t">Testcontainers (MySQL)</text>

  <text x="600" y="130" text-anchor="middle" class="h">Phase 3 · Security</text>
  <text x="600" y="152" text-anchor="middle" class="t">steps 7–9</text>
  <text x="600" y="172" text-anchor="middle" class="t">Trivy filesystem scan</text>
  <text x="600" y="190" text-anchor="middle" class="t">SonarCloud · fail on secrets</text>

  <text x="840" y="130" text-anchor="middle" class="h">Phase 4 · Image</text>
  <text x="840" y="152" text-anchor="middle" class="t">steps 10–14</text>
  <text x="840" y="172" text-anchor="middle" class="t">Docker Buildx build</text>
  <text x="840" y="190" text-anchor="middle" class="t">Trivy image scans</text>

  <text x="1080" y="130" text-anchor="middle" class="h">Phase 5 · ECR</text>
  <text x="1080" y="152" text-anchor="middle" class="t">steps 15–19</text>
  <text x="1080" y="172" text-anchor="middle" class="t">AWS login · push image</text>
  <text x="1080" y="190" text-anchor="middle" class="t">ECR scan · artifacts</text>

  <!-- arrows row 1 -->
  <path id="r1a" class="arrow" d="M220,160 L260,160" marker-end="url(#head)"/>
  <path id="r1b" class="arrow" d="M460,160 L500,160" marker-end="url(#head)"/>
  <path id="r1c" class="arrow" d="M700,160 L740,160" marker-end="url(#head)"/>
  <path id="r1d" class="arrow" d="M940,160 L980,160" marker-end="url(#head)"/>

  <!-- ROW 2: CD (right to left) -->
  <text x="20" y="268" class="lane">CD · GITOPS DEPLOY</text>
  <path id="down" class="arrow" d="M1080,220 L1080,290" marker-end="url(#head)"/>
  <g filter="url(#shadow)">
    <rect class="box" x="980" y="290" width="200" height="120" rx="16" fill="#ec4899" style="animation-delay:1.5s"/>
    <rect class="box" x="740" y="290" width="200" height="120" rx="16" fill="#14b8a6" style="animation-delay:1.8s"/>
    <rect class="box" x="500" y="290" width="200" height="120" rx="16" fill="#2563eb" style="animation-delay:2.1s"/>
    <rect class="box" x="260" y="290" width="200" height="120" rx="16" fill="#84cc16" style="animation-delay:2.4s"/>
    <rect class="box" x="20"  y="290" width="200" height="120" rx="16" fill="#475569" style="animation-delay:2.7s"/>
  </g>
  <text x="1080" y="320" text-anchor="middle" class="h">Step 20 · CD trigger</text>
  <text x="1080" y="342" text-anchor="middle" class="t">GitHub API + PAT</text>
  <text x="1080" y="362" text-anchor="middle" class="t">deploy.yml once per env</text>
  <text x="1080" y="380" text-anchor="middle" class="t">waits 60 s between envs</text>

  <text x="840" y="320" text-anchor="middle" class="h">Deployment repo</text>
  <text x="840" y="342" text-anchor="middle" class="t">Helm values updated</text>
  <text x="840" y="362" text-anchor="middle" class="t">image repo + tag</text>
  <text x="840" y="380" text-anchor="middle" class="t">committed to Git</text>

  <text x="600" y="320" text-anchor="middle" class="h">Argo CD sync</text>
  <text x="600" y="342" text-anchor="middle" class="t">GitOps: Git is the truth</text>
  <text x="600" y="362" text-anchor="middle" class="t">auto sync · self-heal</text>
  <text x="600" y="380" text-anchor="middle" class="t">Helm chart → Kubernetes</text>

  <text x="360" y="320" text-anchor="middle" class="h">Environments</text>
  <text x="360" y="342" text-anchor="middle" class="t">functional · regression</text>
  <text x="360" y="362" text-anchor="middle" class="t">integration · uat · release</text>
  <text x="360" y="380" text-anchor="middle" class="t">one namespace per env</text>

  <text x="120" y="320" text-anchor="middle" class="h">Run outcome</text>
  <text x="120" y="342" text-anchor="middle" class="t">job summary on run page</text>
  <text x="120" y="362" text-anchor="middle" class="t">reports as artifacts</text>
  <text x="120" y="380" text-anchor="middle" class="t">SonarCloud dashboard</text>

  <!-- arrows row 2 (leftwards) -->
  <path id="r2a" class="arrow" d="M980,350 L940,350" marker-end="url(#head)"/>
  <path id="r2b" class="arrow" d="M740,350 L700,350" marker-end="url(#head)"/>
  <path id="r2c" class="arrow" d="M500,350 L460,350" marker-end="url(#head)"/>
  <path id="r2d" class="arrow" d="M260,350 L220,350" marker-end="url(#head)"/>

  <!-- ROW 3: DevSecOps toolbox -->
  <text x="20" y="450" class="lane">DEVSECOPS TOOLBOX</text>
  <g filter="url(#shadow)">
    <rect x="20"   y="462" width="180" height="46" rx="23" fill="#b91c1c"/>
    <rect x="216"  y="462" width="180" height="46" rx="23" fill="#c2410c"/>
    <rect x="412"  y="462" width="180" height="46" rx="23" fill="#a16207"/>
    <rect x="608"  y="462" width="180" height="46" rx="23" fill="#15803d"/>
    <rect x="804"  y="462" width="180" height="46" rx="23" fill="#1d4ed8"/>
    <rect x="1000" y="462" width="180" height="46" rx="23" fill="#7e22ce"/>
  </g>
  <text x="110" y="490" text-anchor="middle" class="chip">Gitleaks · secrets</text>
  <text x="306" y="490" text-anchor="middle" class="chip">Trivy · SCA + image</text>
  <text x="502" y="490" text-anchor="middle" class="chip">SonarCloud · SAST</text>
  <text x="698" y="490" text-anchor="middle" class="chip">Maven · JaCoCo</text>
  <text x="894" y="490" text-anchor="middle" class="chip">Docker · Buildx</text>
  <text x="1090" y="490" text-anchor="middle" class="chip">AWS ECR · Argo CD</text>

  <text x="600" y="548" text-anchor="middle" class="sub">Gitleaks findings fail the build · Trivy image gate is temporarily non-blocking · PRs closed without merge are skipped</text>
  <text x="600" y="570" text-anchor="middle" class="sub">Animated dots show data moving through the pipeline</text>

  <!-- animated data dots -->
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#r1a"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath href="#r1b"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#r1c"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s"><mpath href="#r1d"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="1.2s" repeatCount="indefinite" begin="2.4s"><mpath href="#down"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#r2a"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath href="#r2b"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#r2c"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s"><mpath href="#r2d"/></animateMotion></circle>
</svg>

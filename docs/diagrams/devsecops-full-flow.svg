<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="FinTech Ledger DevSecOps CI/CD flow">
  <defs>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub   { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .h     { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .t     { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .chip  { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .lane  { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      .box   { stroke: #ffffff; stroke-width: 2; animation: breathe 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes breathe { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .arrow, .box { animation: none; } }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" class="title">FinTech Ledger · DevSecOps CI/CD Flow</text>
  <text x="600" y="60" text-anchor="middle" class="sub">Java 17 Spring Boot microservice · GitHub Actions (CI) → Deployment repo → Argo CD (GitOps CD)</text>

  <!-- ROW 1: CI (left to right) -->
  <text x="20" y="90" class="lane">CI · BUILD &amp; SECURE</text>
  <g filter="url(#shadow)">
    <rect class="box" x="20"  y="100" width="200" height="110" rx="16" fill="#6366f1"/>
    <rect class="box" x="260" y="100" width="200" height="110" rx="16" fill="#0ea5e9" style="animation-delay:.3s"/>
    <rect class="box" x="500" y="100" width="200" height="110" rx="16" fill="#f59e0b" style="animation-delay:.6s"/>
    <rect class="box" x="740" y="100" width="200" height="110" rx="16" fill="#10b981" style="animation-delay:.9s"/>
    <rect class="box" x="980" y="100" width="200" height="110" rx="16" fill="#8b5cf6" style="animation-delay:1.2s"/>
  </g>
  <text x="120" y="135" text-anchor="middle" class="h">1 · Trigger</text>
  <text x="120" y="160" text-anchor="middle" class="t">push to feature</text>
  <text x="120" y="178" text-anchor="middle" class="t">PR opened / merged · manual</text>

  <text x="360" y="135" text-anchor="middle" class="h">2 · Build + Test</text>
  <text x="360" y="160" text-anchor="middle" class="t">Gitleaks secret scan</text>
  <text x="360" y="178" text-anchor="middle" class="t">Maven clean verify · JaCoCo</text>

  <text x="600" y="135" text-anchor="middle" class="h">3 · SCA + SAST</text>
  <text x="600" y="160" text-anchor="middle" class="t">Trivy dependency scan</text>
  <text x="600" y="178" text-anchor="middle" class="t">SonarCloud · quality gate</text>

  <text x="840" y="135" text-anchor="middle" class="h">4 · Image + Scan</text>
  <text x="840" y="160" text-anchor="middle" class="t">Docker Buildx build</text>
  <text x="840" y="178" text-anchor="middle" class="t">Trivy image scan (CRITICAL)</text>

  <text x="1080" y="135" text-anchor="middle" class="h">5 · ECR Push</text>
  <text x="1080" y="160" text-anchor="middle" class="t">AWS ECR · scan on push</text>
  <text x="1080" y="178" text-anchor="middle" class="t">reports saved as artifact</text>

  <!-- arrows row 1 -->
  <path id="r1a" class="arrow" d="M220,155 L260,155" marker-end="url(#head)"/>
  <path id="r1b" class="arrow" d="M460,155 L500,155" marker-end="url(#head)"/>
  <path id="r1c" class="arrow" d="M700,155 L740,155" marker-end="url(#head)"/>
  <path id="r1d" class="arrow" d="M940,155 L980,155" marker-end="url(#head)"/>

  <!-- ROW 2: CD (right to left) -->
  <text x="20" y="262" class="lane">CD · GITOPS DEPLOY</text>
  <path id="down" class="arrow" d="M1080,210 L1080,290" marker-end="url(#head)"/>
  <g filter="url(#shadow)">
    <rect class="box" x="980" y="290" width="200" height="110" rx="16" fill="#ec4899" style="animation-delay:1.5s"/>
    <rect class="box" x="740" y="290" width="200" height="110" rx="16" fill="#14b8a6" style="animation-delay:1.8s"/>
    <rect class="box" x="500" y="290" width="200" height="110" rx="16" fill="#2563eb" style="animation-delay:2.1s"/>
    <rect class="box" x="260" y="290" width="200" height="110" rx="16" fill="#84cc16" style="animation-delay:2.4s"/>
    <rect class="box" x="20"  y="290" width="200" height="110" rx="16" fill="#475569" style="animation-delay:2.7s"/>
  </g>
  <text x="1080" y="325" text-anchor="middle" class="h">6 · CD Dispatch</text>
  <text x="1080" y="350" text-anchor="middle" class="t">GitHub API + PAT</text>
  <text x="1080" y="368" text-anchor="middle" class="t">deploy.yml per env</text>

  <text x="840" y="325" text-anchor="middle" class="h">7 · Update Values</text>
  <text x="840" y="350" text-anchor="middle" class="t">CD repo: Helm image</text>
  <text x="840" y="368" text-anchor="middle" class="t">repo + tag committed</text>

  <text x="600" y="325" text-anchor="middle" class="h">8 · Argo CD Sync</text>
  <text x="600" y="350" text-anchor="middle" class="t">GitOps: Git = truth</text>
  <text x="600" y="368" text-anchor="middle" class="t">auto sync · self-heal</text>

  <text x="360" y="325" text-anchor="middle" class="h">9 · Environments</text>
  <text x="360" y="350" text-anchor="middle" class="t">functional · regression</text>
  <text x="360" y="368" text-anchor="middle" class="t">integration · uat</text>

  <text x="120" y="325" text-anchor="middle" class="h">10 · Feedback</text>
  <text x="120" y="350" text-anchor="middle" class="t">run summary + reports</text>
  <text x="120" y="368" text-anchor="middle" class="t">SonarCloud dashboard</text>

  <!-- arrows row 2 (leftwards) -->
  <path id="r2a" class="arrow" d="M980,345 L940,345" marker-end="url(#head)"/>
  <path id="r2b" class="arrow" d="M740,345 L700,345" marker-end="url(#head)"/>
  <path id="r2c" class="arrow" d="M500,345 L460,345" marker-end="url(#head)"/>
  <path id="r2d" class="arrow" d="M260,345 L220,345" marker-end="url(#head)"/>

  <!-- ROW 3: security toolbox -->
  <text x="20" y="450" class="lane">DEVSECOPS TOOLBOX</text>
  <g filter="url(#shadow)">
    <rect x="20"   y="462" width="180" height="46" rx="23" fill="#b91c1c"/>
    <rect x="216"  y="462" width="180" height="46" rx="23" fill="#c2410c"/>
    <rect x="412"  y="462" width="180" height="46" rx="23" fill="#a16207"/>
    <rect x="608"  y="462" width="180" height="46" rx="23" fill="#15803d"/>
    <rect x="804"  y="462" width="180" height="46" rx="23" fill="#1d4ed8"/>
    <rect x="1000" y="462" width="180" height="46" rx="23" fill="#7e22ce"/>
  </g>
  <text x="110" y="490" text-anchor="middle" class="chip">Gitleaks · secrets</text>
  <text x="306" y="490" text-anchor="middle" class="chip">Trivy · SCA + image</text>
  <text x="502" y="490" text-anchor="middle" class="chip">SonarCloud · SAST</text>
  <text x="698" y="490" text-anchor="middle" class="chip">Maven · JaCoCo</text>
  <text x="894" y="490" text-anchor="middle" class="chip">Docker · Buildx</text>
  <text x="1090" y="490" text-anchor="middle" class="chip">AWS ECR · Argo CD</text>

  <text x="600" y="548" text-anchor="middle" class="sub">Gate rule: Gitleaks findings fail the build · Trivy image gate is temporarily non-blocking · PRs closed without merge are skipped</text>
  <text x="600" y="570" text-anchor="middle" class="sub">Dots show data moving along the pipeline</text>

  <!-- animated data dots -->
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#r1a"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath href="#r1b"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#r1c"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s"><mpath href="#r1d"/></animateMotion></circle>
  <circle r="6" fill="#f43f5e"><animateMotion dur="1.2s" repeatCount="indefinite" begin="2.4s"><mpath href="#down"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#r2a"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath href="#r2b"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath href="#r2c"/></animateMotion></circle>
  <circle r="6" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s"><mpath href="#r2d"/></animateMotion></circle>
</svg>

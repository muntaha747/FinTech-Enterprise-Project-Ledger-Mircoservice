name: ledger ci build
# push to feature   -> build fb<N>  -> CD: functional
# pull request      -> build fb<N>  -> CD: functional
# PR merged to main -> build rel<N> -> CD: regression + integration (only after a successful PR)
# manual run        -> build from the chosen branch -> CD: the TEST_ENV you pick
on:
  push:
    branches:
      - feature
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      ECRURL:
        description: "ECR Registry URL"
        required: true
        default: "747240980649.dkr.ecr.us-east-1.amazonaws.com"

      APPREPO:
        description: "Elastic Container Registry Name"
        required: true
        default: "fintech-ledgerservice"

      REGION:
        description: "AWS Region"
        required: true
        default: "us-east-1"

      TEST_ENV:
        description: "Environment to deploy to after the build"
        required: true
        type: choice
        default: "regression"
        options:
          - functional
          - regression
          - integration
          - regression-and-integration

env:
  CD_REPO: muntaha747/FinTech-Enterprise-Project-Ledger-Mircoservice-Deployment-Pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip PRs that were closed without merging, and merged PRs that did not come from feature
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'feature')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide image tag, registry and test environments
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          RUN_NO: ${{ github.run_number }}
          TEST_CHOICE: ${{ inputs.TEST_ENV }}
          IN_REGISTRY: ${{ inputs.ECRURL }}
          IN_REPO: ${{ inputs.APPREPO }}
          IN_REGION: ${{ inputs.REGION }}
        run: |
          # registry, repo and region: from the manual inputs, or the defaults for PR runs
          echo "registry=${IN_REGISTRY:-747240980649.dkr.ecr.us-east-1.amazonaws.com}" >> "$GITHUB_OUTPUT"
          echo "repo=${IN_REPO:-fintech-ledgerservice}" >> "$GITHUB_OUTPUT"
          echo "region=${IN_REGION:-us-east-1}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "closed" ]; then
            TAG="rel$RUN_NO"; ENVS="regression integration"
          elif [ "$EVENT" = "pull_request" ]; then
            TAG="fb$RUN_NO"; ENVS="functional"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then TAG="rel$RUN_NO"; else TAG="fb$RUN_NO"; fi
            case "$TEST_CHOICE" in
              functional)                 ENVS="functional" ;;
              regression)                 ENVS="regression" ;;
              integration)                ENVS="integration" ;;
              regression-and-integration) ENVS="regression integration" ;;
              *) echo "unknown TEST_ENV: $TEST_CHOICE"; exit 1 ;;
            esac
          else
            TAG="fb$RUN_NO"; ENVS="functional"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG  Environments: $ENVS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Docker API version for Testcontainers
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      - name: Build and test (JaCoCo)
        run: mvn -B clean verify -Ddependency-check.skip=true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Trivy filesystem scan
        continue-on-error: true
        run: |
          mkdir -p trivy-report
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -v "$GITHUB_WORKSPACE/trivy-report":/report \
            aquasec/trivy:0.50.0 fs /project --format json --output /report/trivy-report.json

      - name: SonarCloud scan (feature PR and main merge)
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.sonarcloud }}
          SONAR_BRANCH: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed' && 'main') || (github.event_name == 'pull_request' && 'feature') || github.ref_name }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=muntaha747_FinTech-Enterprise-Project-Ledger-Mircoservice \
            -Dsonar.organization=muntaha747 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.branch.name=$SONAR_BRANCH \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.plan.outputs.region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.plan.outputs.registry }}
          REPO: ${{ steps.plan.outputs.repo }}
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          IMAGE="$REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: ECR scan summary (non-blocking)
        continue-on-error: true
        env:
          REPO: ${{ steps.plan.outputs.repo }}
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG"
          aws ecr describe-image-scan-findings --repository-name "$REPO" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts' --output json

      - name: Trigger CD repo (deploy.yml) for each environment
        env:
          REGISTRY: ${{ steps.plan.outputs.registry }}
          REPO: ${{ steps.plan.outputs.repo }}
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
          TEST_ENVS: ${{ steps.plan.outputs.envs }}
        run: |
          for TEST_ENV in $TEST_ENVS; do
            echo "CD: $TEST_ENV <- $IMAGE_TAG"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/muntaha747/FinTech-Enterprise-Project-Ledger-Mircoservice-Deployment-Pipeline/actions/workflows/deploy.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"ECRURL\":\"$REGISTRY/\",\"REPO\":\"$REPO\",\"IMAGE\":\"$IMAGE_TAG\",\"TEST\":\"$TEST_ENV\"}}"
            # give the CD run time to commit before the next environment starts
            sleep 60
          done

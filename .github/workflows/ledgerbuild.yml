name: ledger ci build

# feature push      -> build fb<N>  -> CD: regression
# pull request      -> build fb<N>  -> CD: functional
# push to main      -> build rel<N> -> CD: regression + integration

on:
  push:
    branches:
      - feature
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 747240980649.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: fintech-ledgerservice
  CD_REPO: muntaha747/FinTech-Enterprise-Project-Ledger-Mircoservice-Deployment-Pipeline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide image tag and test environments
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=fb${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "envs=functional" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=rel${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "envs=regression integration" >> "$GITHUB_OUTPUT"
          else
            echo "tag=fb${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "envs=regression" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Docker API version for Testcontainers
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      - name: Build and test (JaCoCo)
        run: mvn -B clean verify -Ddependency-check.skip=true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Trivy filesystem scan
        continue-on-error: true
        run: |
          mkdir -p trivy-report
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -v "$GITHUB_WORKSPACE/trivy-report":/report \
            aquasec/trivy:0.50.0 fs /project --format json --output /report/trivy-report.json

      - name: SonarCloud scan (main push only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.sonarcloud }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=wezva-fintech_ledger-build \
            -Dsonar.organization=wezva-fintech \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: ECR scan summary (non-blocking)
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          aws ecr wait image-scan-complete --repository-name "$ECR_REPO" --image-id imageTag="$IMAGE_TAG"
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPO" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts' --output json

      - name: Trigger CD repo (deploy.yml) for each environment
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
          TEST_ENVS: ${{ steps.plan.outputs.envs }}
        run: |
          for TEST_ENV in $TEST_ENVS; do
            echo "CD: $TEST_ENV <- $IMAGE_TAG"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$CD_REPO/actions/workflows/deploy.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"ECRURL\":\"$ECR_REGISTRY/\",\"REPO\":\"$ECR_REPO\",\"IMAGE\":\"$IMAGE_TAG\",\"TEST\":\"$TEST_ENV\"}}"
            # give the CD run time to commit before the next environment starts
            sleep 60
          done
